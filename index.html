<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #preview-container {
            width: 100vw;
            height: 100vh;
            background: white;
            overflow: auto;
            position: relative;
        }
    </style>
</head>
<body>
    
    <div id="preview-container">
        <!-- Konten preview akan muncul di sini -->
        <div style="text-align:center; padding: 100px 20px; color: #888; font-size: 18px;">
            <h2>Preview Website</h2>
            <p>Kirim codingan dari halaman Editor untuk melihat hasilnya di sini.</p>
        </div>
    </div>

    <script>
        const container = document.getElementById('preview-container');

        // Terima kode dari Index 1
        const channel = new BroadcastChannel('website-preview');

        channel.onmessage = function(event) {
            if (event.data === "REFRESH") {
                // Force refresh tampilan
                const currentHTML = container.innerHTML;
                container.innerHTML = currentHTML;
                return;
            }
            
            // Tampilkan kode HTML yang dikirim dari Index 1
            container.innerHTML = event.data;
        };
    </script>
</body>
</html>
